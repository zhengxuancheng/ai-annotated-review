name: Feature request
description: Propose a scoped feature or improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem does this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the smallest useful version.
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - Desktop ChatGPT v1
        - Core package
        - Documentation
        - Future platform adapter
        - Out of scope for v1
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Boundaries
      options:
        - label: This does not require scraping or modifying native ChatGPT/Claude/Codex UI.
        - label: This does not silently send data back to ChatGPT.
        - label: This does not add accounts, billing, telemetry, cloud sync, or external LLM calls.
